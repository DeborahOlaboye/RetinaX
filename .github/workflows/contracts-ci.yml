name: Contract CI

on:
  pull_request:
    paths: ["contracts/**", "test/**", "Cargo.toml", "Cargo.lock"]
  push:
    branches: [main]
    paths: ["contracts/**", "test/**", "Cargo.toml", "Cargo.lock"]

permissions:
  contents: read

jobs:
  contract:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: compliance
            label: access_control
          - package: vision_records
            label: clinical_records
          - package: staking
            label: staking
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          target: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p ${{ matrix.package }} --all-targets -- -D warnings
      - run: cargo test -p ${{ matrix.package }} --all-targets
      - run: cargo build -p ${{ matrix.package }} --target wasm32-unknown-unknown --release
